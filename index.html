<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>パシャカロ</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="パシャカロ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#faf8f5">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yomogi&display=swap">
<style>
:root{--accent:#E8691A;--ink:#1f1d1b;--bg:#faf8f5;--card:#fff;--sub:#8a847d;--line:#ece8e2;--soft:#f3efe9;--over:#c0392b;--ok:#4f7a63;--shadow:0 1px 2px rgba(31,29,27,.04),0 10px 30px rgba(31,29,27,.05)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",sans-serif;font-size:15px;letter-spacing:.01em;font-feature-settings:"palt"}
body{padding-bottom:calc(120px + env(safe-area-inset-bottom))}
header{padding:calc(14px + env(safe-area-inset-top)) 22px 4px}
.brand{font-size:13px;letter-spacing:.28em;color:var(--sub);font-weight:500}
.brand i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:8px;vertical-align:1px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
header .chips{margin-top:10px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 15px;font-size:13px;color:var(--ink);font-family:inherit}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
main{padding:0 18px}
.card{background:var(--card);border-radius:24px;padding:22px 20px;margin:14px 0;box-shadow:var(--shadow)}
h2{font-size:12px;letter-spacing:.18em;color:var(--sub);font-weight:500;margin:0 0 12px}
.sub{color:var(--sub);font-size:12.5px}
.big{font-size:54px;font-weight:200;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hero{text-align:center;padding:26px 20px 22px;position:relative}
.hero .me{position:absolute;left:16px;top:14px;height:54px;width:auto;opacity:.92;pointer-events:none}
.ringwrap{position:relative;width:196px;height:196px;margin:2px auto 0}
.ringwrap svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ringin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringin .big{font-size:48px}
.pfc{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px;text-align:left}
.pfc b{font-weight:500;font-size:17px;font-variant-numeric:tabular-nums}
.bar{height:3px;border-radius:2px;background:var(--soft);overflow:hidden;margin-top:7px}
.bar>i{display:block;height:100%;border-radius:2px;background:var(--accent)}
.datebar{display:flex;align-items:center;justify-content:center;gap:6px;margin:10px 0 0}
.datebar b{font-weight:500;font-size:15px;min-width:130px;text-align:center}
.datebar button{border:0;background:none;font-size:20px;padding:6px 14px;color:var(--sub);font-family:inherit}
.meal{padding:16px 0;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0;padding-top:2px}
.mh{display:flex;gap:12px;align-items:baseline;justify-content:space-between}
.mh .t{min-width:0;flex:1}
.mh .t b{display:block;font-weight:500;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mh .k{font-size:22px;font-weight:300;white-space:nowrap;font-variant-numeric:tabular-nums}
.mh .k small{font-size:11px;color:var(--sub);margin-left:2px}
.strip{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip img{width:62px;height:62px;border-radius:14px;object-fit:cover;flex:none;background:var(--soft)}
button{font-family:inherit}
button.primary{background:var(--ink);color:#fff;border:0;border-radius:999px;padding:16px;font-size:15.5px;font-weight:500;width:100%;letter-spacing:.04em}
button.primary:disabled{opacity:.45}
button.ghost{background:transparent;border:1px solid var(--line);border-radius:999px;padding:13px;font-size:14.5px;width:100%;color:var(--ink)}
button.danger,.danger{color:var(--over)}
button.link{background:none;border:0;color:var(--sub);font-size:13px;padding:6px}
.fab{position:fixed;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom));z-index:6;text-align:center;pointer-events:none}
.fab button{pointer-events:auto;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:15px 28px;font-size:15px;font-weight:500;letter-spacing:.06em;box-shadow:0 10px 28px rgba(232,105,26,.35)}
nav{position:fixed;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:7;background:rgba(255,255,255,.97);border-radius:26px;display:flex;padding:6px;box-shadow:0 8px 30px rgba(31,29,27,.10);border:1px solid rgba(255,255,255,.7)}
nav button{flex:1;border:0;background:none;padding:9px 0 7px;font-size:10.5px;color:var(--sub);letter-spacing:.06em;border-radius:20px}
nav button.on{color:var(--ink);font-weight:600;background:var(--soft)}
nav button svg{display:block;margin:0 auto 3px;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
label.f{display:block;font-size:11.5px;letter-spacing:.1em;color:var(--sub);margin:14px 0 6px}
input,select,textarea{width:100%;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font-family:inherit;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px;background-repeat:no-repeat}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grid4 label{font-size:10.5px;color:var(--sub);letter-spacing:.06em}
.grid4 input{padding:10px 6px;text-align:right}
.modal{position:fixed;inset:0;z-index:20;background:rgba(31,29,27,.38);display:flex;align-items:flex-end;}
.sheet{background:var(--bg);width:100%;max-height:94vh;overflow:auto;border-radius:30px 30px 0 0;padding:10px 20px calc(28px + env(safe-area-inset-bottom))}
.sheet:before{content:"";display:block;width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet h3{margin:0 0 6px;font-size:18px;font-weight:500;letter-spacing:.04em}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.thumbs>div{position:relative}
.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:16px;display:block}
.thumbs b{position:absolute;top:-6px;right:-6px;background:var(--ink);color:#fff;border-radius:50%;width:22px;height:22px;text-align:center;line-height:22px;font-size:13px;font-weight:400}
.pick2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0}
.pick2 button{border:1px dashed #d9d2c8;background:#fff;border-radius:18px;padding:18px 8px;font-size:13.5px;color:var(--ink);line-height:1.5}
.pick2 button span{display:block;font-size:22px;color:var(--accent)}
.item{background:#fff;border-radius:18px;padding:12px;margin:10px 0;box-shadow:var(--shadow)}
.item .r{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.badge{display:inline-block;border-radius:999px;padding:3px 10px;font-size:11px;background:var(--soft);color:var(--sub);vertical-align:2px;letter-spacing:.06em;font-weight:400}
.note{background:var(--soft);border-radius:16px;padding:12px 14px;font-size:13px;line-height:1.7;margin:12px 0}
.scale{display:flex;gap:6px;margin:12px 0 6px}
.scale button{flex:1;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 0;font-size:13px}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));z-index:50;max-width:calc(100% - 40px);background:rgba(31,29,27,.88);color:#fff;border-radius:999px;padding:10px 20px;font-size:13px;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 8px 24px rgba(31,29,27,.2);opacity:0;transform:translate(-50%,-14px);pointer-events:none;transition:opacity .25s,transform .3s cubic-bezier(.2,.8,.2,1)}
#toast.on{opacity:1;transform:translate(-50%,0)}
.gate{max-width:420px;margin:12vh auto 0;padding:0 24px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:s 1s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes s{to{transform:rotate(360deg)}}
/* 目標ヘッダー */
.goal{margin-top:2px;cursor:pointer}
.goal .gl{font-size:11px;letter-spacing:.2em;color:var(--sub)}
.goal .gt{font-size:24px;font-weight:300;letter-spacing:-.01em;margin-top:3px;font-variant-numeric:tabular-nums}
.goal .gt span{font-size:12.5px;color:var(--accent);margin-left:10px;letter-spacing:.04em;font-weight:500}
.gbar{height:3px;border-radius:2px;background:var(--soft);margin:9px 0 7px;overflow:hidden;max-width:280px}
.gbar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.gs{font-size:11.5px;color:var(--sub);line-height:1.6}
.xclose{position:sticky;top:6px;display:block;margin:-6px 0 -30px auto;width:36px;height:36px;border-radius:50%;border:0;background:var(--soft);color:var(--ink);font-size:21px;line-height:36px;padding:0;z-index:3}
.cheer{margin:10px 4px 0;padding:9px 14px 8px;background:#fff8e6;border-radius:6px;transform:rotate(-.6deg);box-shadow:0 1px 3px rgba(31,29,27,.1);font-family:"Yomogi","Klee","Hannotate SC","Yuji Syuku",cursive;color:#3a3430;position:relative;line-height:1.55}
.cheer:before{content:"";position:absolute;left:50%;top:-6px;width:44px;height:12px;margin-left:-22px;background:rgba(232,105,26,.35);transform:rotate(2deg)}
.cheer .ct{font-size:10.5px;letter-spacing:.08em;color:var(--accent)}
.cheer .cm{font-size:14.5px;margin-top:1px}
.cheer .cs{font-size:11px;text-align:right;color:var(--sub);margin-top:1px}
.card{position:relative}
.hero .me2{position:absolute;right:16px;top:14px;height:50px;width:auto;opacity:.92;pointer-events:none}
.deco{position:absolute;right:18px;top:14px;height:42px;width:auto;pointer-events:none}
.mood{height:26px;width:auto;vertical-align:-7px;margin-left:8px}
.empty{text-align:center;padding:4px 0 6px}
.empty img{height:72px;width:auto;display:block;margin:0 auto 8px}
.add-ph{width:58px;height:58px;border:1px dashed #d9d2c8;border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:22px;background:#fff}
.fab button+button{margin-left:10px}
.fab button.ink{background:var(--ink);box-shadow:0 10px 28px rgba(31,29,27,.25)}
.sub2{font-size:11.5px;color:var(--sub);letter-spacing:.06em}
.chips.wrap{gap:7px}
.chip.sm{padding:6px 12px;font-size:12.5px}
.exrow{display:flex;justify-content:space-between;align-items:baseline;padding:13px 0;border-top:1px solid var(--line)}
.exrow:first-of-type{border-top:0;padding-top:2px}
.exrow b{font-weight:500}
.exrow .k{font-size:20px;font-weight:300}
.exrow .k small{font-size:11px;color:var(--sub);margin-left:2px}
/* ローディング */
.splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:var(--bg);z-index:30}
.splash svg{width:88px;height:88px;animation:rot 1.5s cubic-bezier(.5,.1,.5,.9) infinite}
.splash .dot{position:absolute;width:20px;height:20px;border-radius:50%;background:var(--ink);animation:pulse 1.5s ease-in-out infinite}
.splash .ring{position:relative;width:88px;height:88px;display:flex;align-items:center;justify-content:center}
.splash .nm{letter-spacing:.34em;font-size:14px;color:var(--ink);font-weight:500;text-align:center;padding-left:.34em;animation:fade 1.5s ease-in-out infinite}
.splash .nm small{display:block;letter-spacing:.22em;font-size:10px;color:var(--sub);margin-top:9px;font-weight:400}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(.85);opacity:.9}50%{transform:scale(1.15);opacity:1}}
@keyframes fade{0%,100%{opacity:.55}50%{opacity:1}}
.sk{background:linear-gradient(90deg,#f1ece5 25%,#f9f6f1 50%,#f1ece5 75%);background-size:200% 100%;animation:sh 1.4s ease-in-out infinite;border-radius:12px}
@keyframes sh{to{background-position:-200% 0}}
table{width:100%;border-collapse:collapse}
td{padding:12px 0;border-top:1px solid var(--line)}
tr:first-child td{border-top:0}
td:last-child{text-align:right}

/* ---- v24 ブラッシュアップ ---- */
.sub{font-size:13px}
h2{font-size:11.5px;letter-spacing:.2em;display:flex;align-items:center;gap:8px}
h2:before{content:"";width:3px;height:11px;border-radius:2px;background:var(--accent)}
.card{border-radius:26px;box-shadow:0 1px 2px rgba(31,29,27,.04),0 12px 32px rgba(31,29,27,.06)}
.hero{background:linear-gradient(180deg,#fff 0%,#fffaf5 100%)}
.ringwrap{filter:drop-shadow(0 6px 14px rgba(232,105,26,.18))}
.ringin .big{font-size:54px;font-weight:200}
.rarc{transition:stroke-dasharray .8s cubic-bezier(.2,.8,.2,1)}
.pfc b{font-size:18px}
.bar{height:4px}
.goal .gt{font-size:26px}
.goal .gs{font-size:12px}
.gbar{height:4px;max-width:300px}
.tag{display:inline-block;font-size:10.5px;line-height:1;padding:3px 8px;border-radius:999px;background:var(--soft);color:var(--sub);margin-right:7px;vertical-align:1px;letter-spacing:.06em}
.tag.t-朝食{background:#fdeede;color:#c2570f}
.tag.t-昼食{background:#fde3d0;color:#b8480a}
.tag.t-夕食{background:#efe6df;color:#6f5444}
.tag.t-間食{background:#f3efe9;color:#8a847d}
.mh .k{font-size:24px}
.mh .t b{font-size:16px}
.meal,.exrow{transition:background .15s}
.meal:active,.exrow:active{background:#faf6f0}
.strip img{width:66px;height:66px;border-radius:16px}
nav{border-radius:28px;box-shadow:0 10px 34px rgba(31,29,27,.12)}
nav button{transition:background .2s,color .2s}
nav button.on{color:var(--accent);background:#fdf1e7}
button.primary,.fab button,.chip{transition:transform .12s}
button.primary:active,.fab button:active,.chip:active{transform:scale(.97)}
.fab button{padding:16px 26px;font-size:15.5px}
.datebar b{font-size:16px}
.datebar b#dsel{cursor:pointer;padding:6px 10px;border-radius:12px}
.datebar b#dsel:active{background:var(--soft)}
.datebar b#dsel:after{content:"";display:inline-block;width:6px;height:6px;border-right:1.5px solid var(--sub);border-bottom:1.5px solid var(--sub);transform:rotate(45deg);margin:0 0 4px 8px}
.calhd{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}
.calhd b{font-size:17px;font-weight:500;letter-spacing:.04em}
.calhd button{border:0;background:none;font-size:22px;width:44px;height:38px;border-radius:12px;color:var(--sub);font-family:inherit}
.calhd button:active{background:var(--soft)}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calg .w{text-align:center;font-size:11px;color:var(--sub);padding:2px 0 6px;letter-spacing:.06em}
.calg .w.su{color:var(--over)}.calg .w.sa{color:#3a6ea5}
.calg button{border:0;background:none;font-family:inherit;color:var(--ink);height:52px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:7px 0 0;font-size:15px;font-variant-numeric:tabular-nums}
.calg button:active{background:var(--soft)}
.calg button small{font-size:9.5px;color:var(--sub);margin-top:3px;letter-spacing:0}
.calg button small.ov{color:var(--over)}
.calg button.td{box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--accent);font-weight:500}
.calg button.on{background:var(--accent);color:#fff;box-shadow:none}
.calg button.on small{color:rgba(255,255,255,.85)}
.calg button.fu{color:#c9c0b4}
.datebar button{width:44px;height:36px;border-radius:12px}
.datebar button:active{background:var(--soft)}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
main>*{animation:up .4s cubic-bezier(.2,.8,.2,1) both}
main>*:nth-child(2){animation-delay:.05s}
main>*:nth-child(3){animation-delay:.1s}
main>*:nth-child(4){animation-delay:.15s}
@keyframes sheetin{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet{border-radius:32px 32px 0 0;box-shadow:0 -10px 40px rgba(31,29,27,.15);animation:sheetin .3s cubic-bezier(.2,.8,.2,1)}
.chip.on{box-shadow:0 4px 12px rgba(31,29,27,.18)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,105,26,.12)}
.aiedit{margin-top:16px;padding:14px;border-radius:18px;background:#fff7f0;border:1px solid #f6dcc8}.aiedit textarea{background:#fff}
.share{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px 16px 12px;margin-top:4px}
.share .sv{display:flex;align-items:baseline;gap:2px;margin-bottom:10px}
.share .sv b{font-size:40px;font-weight:200;line-height:1;font-variant-numeric:tabular-nums;color:var(--accent)}
.share .sv span{font-size:15px;color:var(--accent)}
.share .sv small{margin-left:12px;font-size:12.5px;color:var(--sub)}
.share input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;padding:0;border:0;background:transparent;box-shadow:none}
.share input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--accent) var(--p),var(--soft) var(--p))}
.share input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:0;margin-top:-11px;box-shadow:0 2px 8px rgba(31,29,27,.25),0 0 0 1px rgba(31,29,27,.06)}
.share .chips{margin-top:8px}
.chip i{display:block;font-style:normal;font-size:10px;opacity:.6;margin-top:1px}
.chip.sm{line-height:1.25}
.rest small{display:block;font-size:12px;color:var(--sub);letter-spacing:.08em}
.rest .rv{font-size:17px;margin-top:4px;color:var(--ink)}
.rest .rv b{font-size:40px;font-weight:300;color:var(--accent);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.rest.over .rv,.rest.over .rv b{color:var(--over)}
.eq{display:flex;align-items:flex-end;justify-content:center;gap:14px;margin-top:14px}
.rest{padding-top:14px;border-top:1px solid var(--line)}
.eq>div{text-align:center;min-width:64px}
.eq small{display:block;font-size:11px;color:var(--sub);letter-spacing:.1em}
.eq b{font-size:20px;font-weight:400;font-variant-numeric:tabular-nums}
.eq i{font-style:normal;color:var(--sub);font-size:16px;padding-bottom:2px}
.eq .net b{color:var(--ink);font-weight:600}
.fab button{padding:15px 20px;font-size:15px}
.fab button+button{margin-left:8px}
.fab button.ghostfab{background:#fff;color:var(--ink);box-shadow:0 10px 28px rgba(31,29,27,.14);border:1px solid var(--line)}
.wd{display:block;font-size:12px;color:var(--ok);margin-top:2px;text-align:right}.wd.up{color:var(--over)}
.wbox{display:flex;align-items:center;justify-content:center;gap:16px;margin:18px 0 4px}
.wstep{width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:26px;color:var(--ink);line-height:1;padding:0;box-shadow:var(--shadow)}
.wstep:active{background:var(--soft)}
.wnum{display:flex;align-items:baseline;gap:4px}
.wnum input{width:150px;text-align:center;font-size:54px;font-weight:200;border:0;background:transparent;padding:4px 0;letter-spacing:-.02em}
.wnum input:focus{box-shadow:none}
.wnum span{font-size:16px;color:var(--sub)}
.anarow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.anarow small{display:block;font-size:11.5px;color:var(--sub);letter-spacing:.06em;margin-bottom:4px}
</style>
</head>
<body>

function dirty() { S.cache = {}; }
function swr(key, fetchFn, render, isActive) {
  var c = S.cache[key];

  if (c) return; /* キャッシュがあれば通信しない。最新化は保存後(dirty)かアプリ再起動 */
  fetchFn().then(function (d) {
    var s = JSON.stringify(d);
    if (c && c.s === s) return;
    S.cache[key] = { s: s, data: d };
    if (key === 'd|' + S.me + '|' + S.today) saveSnap(d); else saveSnap();
    if (isActive()) render(d);

function untilText(to) {
  var a = parseDate(S.today), b = parseDate(to);
  if (b <= a) return null;
  var m = (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth());
  var t = new Date(a.getFullYear(), a.getMonth() + m, a.getDate());
  if (t > b) { m--; t = new Date(a.getFullYear(), a.getMonth() + m, a.getDate()); }
  var d = Math.round((b - t) / 86400000);
  return (m > 0 ? m + 'ヶ月' : '') + d + '日';

var SNAP = 'pk_snap_v1';

function boot() {
  var snap = loadSnap(), today = fmtDate(new Date());

  /* 当日の保存データが無ければ画面側(viewDay)が取りに行くのでここでは取らない */
  var dayP = fast && snap.date === today && snap.day ? api('api_day', snap.me, today).catch(function () { return null; }) : null;
  if (fast) {
    S.users = snap.users; S.wl = snap.wl || {}; S.today = today; S.date = today; S.me = snap.me; S.viewId = snap.me;
    if (snap.date === today && snap.day) S.cache['d|' + S.me + '|' + today] = { s: JSON.stringify(snap.day), data: snap.day };
    show();

      S.users = r.users; S.wl = r.weights || {};

      var key = 'd|' + S.me + '|' + S.today, c = S.cache[key];
      if (d) { if (!c || c.s !== JSON.stringify(d)) { S.cache[key] = { s: JSON.stringify(d), data: d }; chg = true; } }

      if (chg && !$('#modal') && S.tab === 'day' && S.viewId === S.me && S.date === S.today) show();

function boot0(r) {
  return Promise.resolve(r).then(function (r) {
    S.users = r.users; S.today = r.today; S.date = S.date || r.today; S.wl = r.weights || {};
    if (!S.users.length) { S.creating = true; S.tab = 'settings'; S.me = ''; show(); return; }

    var me = user(S.me), p = Promise.resolve();

      var d = {}; Object.keys(me).forEach(function (k) { d[k] = me[k]; });
      d.goalName = '卒園式'; d.goalDate = '2027-03-31'; d.goalKg = 8; d.startKg = curKg(S.me); d.startDate = S.today;
      p = api('api_saveUser', d).then(function (rec) { S.users[0] = rec; });

      var d2 = {}; Object.keys(me).forEach(function (k) { d2[k] = me[k]; });

  return s + '</svg>';
}
/* ---------- 設定 ---------- */
var ACT = [[1.2, 'ほぼ運動しない（デスクワーク中心）'], [1.375, '軽い運動（週1〜3回）'], [1.55, '中程度の運動（週3〜5回）'], [1.725, '激しい運動（ほぼ毎日）']];
var PACE = [[0, '体重維持'], [-1, '月1kg減（ゆっくり）'], [-2, '月2kg減'], [-3, '月3kg減（早め）'], [1, '月1kg増']];
function recommend(f) {
  var w = +f.weight, h = +f.height, a = +f.age; if (!w || !h || !a) return null;
  var bmr = 10 * w + 6.25 * h - 5 * a + (f.sex === 'm' ? 5 : -161), tdee = bmr * (+f.activity);
  var kcal = Math.round((tdee + (+f.pace) * 240) / 10) * 10, floor = f.sex === 'm' ? 1500 : 1200;
  kcal = Math.max(kcal, floor);
  var p = Math.round(w * 1.5), fat = Math.round(kcal * 0.25 / 9), c = Math.max(0, Math.round((kcal - p * 4 - fat * 9) / 4));
  return { kcal: kcal, p: p, f: fat, c: c, bmr: Math.round(bmr), tdee: Math.round(tdee) };
}
function viewSettings() {
  var u = S.creating ? { name: 'みなみ', sex: 'f', activity: 1.375, pace: -1, goalName: '卒園式', goalDate: '2027-03-31', goalKg: 8 } : user(S.me), main = $('#main');
  var h = '<div class="card"><h2>' + (S.creating ? 'WELCOME　プロフィール登録' : 'PROFILE & GOAL') + '</h2>' +
    '<label class="f" style="margin-top:0">名前</label><input id="s_name" value="' + esc(u.name || '') + '" maxlength="20">' +
    '<div class="grid2"><div><label class="f">性別</label><select id="s_sex"><option value="m"' + (u.sex === 'm' ? ' selected' : '') + '>男性</option><option value="f"' + (u.sex === 'f' ? ' selected' : '') + '>女性</option></select></div>' +
    '<div><label class="f">年齢</label><input id="s_age" type="number" inputmode="numeric" value="' + (u.age || '') + '"></div>' +
    '<div><label class="f">身長(cm)</label><input id="s_height" type="number" inputmode="decimal" value="' + (u.height || '') + '"></div>' +
    '<div><label class="f">現在の体重(kg)</label><input id="s_weight" type="number" inputmode="decimal" step="0.1" value="' + (u.weight || '') + '"></div></div>' +
    '<label class="f">普段の活動量</label><select id="s_act">' + ACT.map(function (a) { return '<option value="' + a[0] + '"' + (+u.activity === a[0] ? ' selected' : '') + '>' + a[1] + '</option>'; }).join('') + '</select>' +
    '<label class="f">目標ペース</label><select id="s_pace">' + PACE.map(function (a) { return '<option value="' + a[0] + '"' + (+u.pace === a[0] ? ' selected' : '') + '>' + a[1] + '</option>'; }).join('') + '</select>' +
    '<div style="height:14px"></div><button class="ghost" id="calc">目標カロリーを自動計算</button><div id="calcnote" class="sub" style="margin-top:8px;line-height:1.6"></div>' +
    '<div class="grid4" style="margin-top:14px"><div><label>1日 kcal</label><input id="s_kcal" type="number" value="' + (u.kcal || '') + '"></div><div><label>P(g)</label><input id="s_p" type="number" value="' + (u.p || '') + '"></div><div><label>F(g)</label><input id="s_f" type="number" value="' + (u.f || '') + '"></div><div><label>C(g)</label><input id="s_c" type="number" value="' + (u.c || '') + '"></div></div>' +
    '<h2 style="margin-top:22px">中長期の目標</h2><label class="f" style="margin-top:0">目標の名前（例: 卒園式）</label><input id="s_gname" value="' + esc(u.goalName || '') + '" maxlength="30">' +
    '<div class="grid2"><div><label class="f">目標の日</label><input type="date" id="s_gdate" value="' + esc(u.goalDate || '') + '"></div><div><label class="f">減らす体重(kg)</label><input id="s_gkg" type="number" inputmode="decimal" step="0.1" value="' + (u.goalKg || '') + '"></div></div>' +
    '<label class="f">開始時の体重(kg)　※現在の体重ではなく、スタート時点</label><input id="s_skg" type="number" inputmode="decimal" step="0.1" value="' + (u.startKg || '') + '">' +
    '<div style="height:18px"></div><button class="primary" id="ssave">保存する</button></div>';
  main.innerHTML = h;
  var form = function () {
    return { id: S.creating ? '' : S.me, name: $('#s_name').value, sex: $('#s_sex').value, age: $('#s_age').value, height: $('#s_height').value, weight: $('#s_weight').value, activity: $('#s_act').value, pace: $('#s_pace').value, goalName: $('#s_gname').value, goalDate: $('#s_gdate').value, goalKg: $('#s_gkg').value, startKg: $('#s_skg').value, startDate: (S.creating ? S.today : (user(S.me).startDate || S.today)), kcal: $('#s_kcal').value, p: $('#s_p').value, f: $('#s_f').value, c: $('#s_c').value };
  };
  $('#calc').onclick = function () {
    var r = recommend(form()); if (!r) return toast('年齢・身長・体重を入れてください');
    $('#s_kcal').value = r.kcal; $('#s_p').value = r.p; $('#s_f').value = r.f; $('#s_c').value = r.c;
    $('#calcnote').textContent = '基礎代謝 約' + r.bmr + ' kcal／消費 約' + r.tdee + ' kcal をもとに計算しました（数値は直接直せます）';
  };
  $('#ssave').onclick = function () {
    api('api_saveUser', form()).then(function (rec) {
      dirty(); S.me = rec.id; S.viewId = rec.id; S.creating = false;
      return api('api_boot').then(function (r) { S.users = r.users; S.wl = r.weights || {}; toast('保存しました'); S.tab = 'day'; show(); });
    }).catch(function (e) { toast(e.message); });
  };
}

boot();
</script>
