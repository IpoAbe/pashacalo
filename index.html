<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>パシャカロ</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="パシャカロ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#faf8f5">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#faf8f5;--ink:#1f1d1b;--sub:#8a847d;--accent:#E8691A}
html,body{margin:0;height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
#frame{position:fixed;left:0;right:0;top:env(safe-area-inset-top);bottom:env(safe-area-inset-bottom);width:100%;height:calc(100% - env(safe-area-inset-top) - env(safe-area-inset-bottom));border:0;background:var(--bg);opacity:0;transition:opacity .35s}
#frame.on{opacity:1}
.splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:var(--bg)}
.ring{position:relative;width:88px;height:88px;display:flex;align-items:center;justify-content:center}
.ring svg{width:88px;height:88px;animation:rot 1.5s cubic-bezier(.5,.1,.5,.9) infinite}
.dot{position:absolute;width:20px;height:20px;border-radius:50%;background:var(--ink);animation:pulse 1.5s ease-in-out infinite}
.nm{letter-spacing:.34em;font-size:14px;color:var(--ink);font-weight:500;text-align:center;padding-left:.34em;animation:fade 1.5s ease-in-out infinite}
.nm small{display:block;letter-spacing:.22em;font-size:10px;color:var(--sub);margin-top:9px;font-weight:400}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(.85);opacity:.9}50%{transform:scale(1.15);opacity:1}}
@keyframes fade{0%,100%{opacity:.55}50%{opacity:1}}
</style>
</head>
<body>
<div class="splash" id="splash"><div class="ring"><svg viewBox="0 0 88 88"><circle cx="44" cy="44" r="36" fill="none" stroke="#eadfd0" stroke-width="5"/><circle cx="44" cy="44" r="36" fill="none" stroke="#E8691A" stroke-width="5" stroke-linecap="round" stroke-dasharray="110 226"/></svg><span class="dot"></span></div><div class="nm">パシャカロ<small>PHOTO CALORIE</small></div></div>
<iframe id="frame" title="パシャカロ" allow="camera; clipboard-write" src="https://script.google.com/macros/s/AKfycbw4uYQmAvAKRmES5aOQZBJfrTs0I1OG4QKpCJgnvNbjT6iLGwY_rGlh-WlhfCiNMwVs/exec"></iframe>
<script>
var f = document.getElementById('frame'), s = document.getElementById('splash');
f.addEventListener('load', function () {
  f.classList.add('on');
  setTimeout(function () { s.style.display = 'none'; }, 400);
});
</script>
</body>
</html>
